{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Excellent College of Science and Health Technology. Gboko. Benue State">
    <meta name="author" content="SUCCESSGANDE ICT RESOURCES LTD">

    <title>{% block title %} {% endblock %} </title>

    <!-- Custom fonts for this template-->
    <link href="{% static 'static_pages/css/fontawesome-all.css' %}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/myStyles.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.0.0-beta.2/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css">
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
        function submitForm() {
            document.forms["candidate-form"].submit();
        }

        function submitCourseForm() {
            document.forms["course-form"].submit();
        }

        function submitPromoForm() {
            document.forms["student-form"].submit();
        }
    </script>
    <style>
        #customTable {
            width: 100%; /* Set the table width to 100% of the page */
            border-collapse: collapse;
            background-color: white;
            padding: 0;
        }

        #customTable td, #customTable th {
            border: none;
            text-align: center;
        }

        #customTable th.logo, #customTable th.passport {
            width: 100px;
        }

        /* Optional: Adds vertical alignment for logo and passport cells */
        #customTable th.logo, #customTable th.passport {
            vertical-align: middle;
        }
    </style>
    
    
</head>

<body class="bg-gradient-primary">

    {% block content %}
      
       
       
      
    {% endblock %}


    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'static_pages/js/bootstrap.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static 'vendor/jquery-easing/jquery.easing.min.js' %}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'js/sb-admin-2.js' %}"></script>

</body>
