{% extends 'account_base.html' %}

{% block title %} {{ page_title }} {% endblock%}

{% load static %}

{% load crispy_forms_tags %}

{% block content %} 

<div class="container"> 

    <!-- Outer Row -->
    <div class="row justify-content-center">

        <div class="col-xl-10 col-lg-12 col-md-9">

            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <!-- Nested Row within Card Body -->
                    <div class="row mt-5">
                        <div class="col-md-12">
                            <div class="border myCard-body p-5 m-5">
                                <h6 style="color: black; font-size:1.2rem;">Password Reset Done Page</h6>
                                <hr>
                                <div class="alert alert-success">
                                    <h5>A mail has been sent to the email address with instructions for the reset of your password.
                                    </h5>
                                </div>
                                <a class="btn btn-success" href="{% url 'accounts_login' %}">Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

{% endblock %}
