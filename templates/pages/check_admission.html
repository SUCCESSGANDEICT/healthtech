{% extends 'website_base.html' %}



{% load static %}

{% load crispy_forms_tags %}

{% block content %} 

  <!--====== PAGE BANNER PART START ======-->
    
  <section id="page-banner" class="pt-105 pb-110 bg_cover" data-overlay="8" style="background-image: url('{% static 'static_pages/images/page-banner-3.jpg' %}')">
    <div class="container">
        <div class="row">
            
            <div class="col-lg-12">
                <div class="page-banner-cont">
                    <h2> {{page_title}} </h2>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href=" {% url 'Website_Home' %} ">Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page"> {{page_title}} </li>
                        </ol>
                    </nav>
                </div>  <!-- page banner cont -->
            </div>
           
        </div> <!-- row -->
    </div> <!-- container -->
</section>

<!--====== PAGE BANNER PART ENDS ======-->
